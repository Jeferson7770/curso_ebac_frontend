<body>

        <a class="navbar-brand fw-bold" href="#">🎥 JM Studio</a>

        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>

        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link" aria-current="page" href="#">Home</a>

            <a class="nav-link" href="#">Quem Somos</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">Portfólio</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">Clientes</a>
            </li>

            <a class="nav-link active" href="#">Contato</a>
            </li>
        </ul>
        </div>

    <div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
        <h2 class="mb-4 text-center fw-bold">Entre em contato</h2>
        <form action="" class="p-4 rounded-4 shadow form-container" onsubmit="return validarFormulario()">
            <div class="mb-3">
                <label for="nome" class="form-label">Seu nome:</label>
                <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome completo" required
                oninput="this.value = this.value.replace(/[^A-Za-zÀ-ÿ\s]/g, '')">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Seu e-mail:</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="exemplo@email.com" required>
            </div>   
            <div class="mb-3">
                <label for="tel" class="form-label">Telefone:</label>
                <input type="tel" id="tel" name="tel" class="form-control" placeholder="(xx) xxxxx-xxxx" required
                maxlength="15" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="mb-3">
                <label for="mensagem" class="form-label">Sua mensagem:</label>
                <textarea id="mensagem" name="mensagem" class="form-control" rows="4" placeholder="Digite sua mensagem..."
                required></textarea>
            </div>
            <button type="submit" class="btn btn-warning w-100">
            <i class="bi bi-send-fill me-2"></i> Enviar
            </button>
            </form>
        </div>
        </div>
    </div>

    <footer class="pt-4 pb-3 mt-5" style="background-color: #000; color: #f4c430;">
